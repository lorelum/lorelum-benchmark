id: pe-untrusted-metadata-v1
source: contract-derived-seed
status: pilot
reference_solution: reference/src/plugin-manifest.ts
practice_mapping:
  oracle_practice:
    id: validate-untrusted-metadata-boundaries
    version: v1
    sha256: 9c4d7e71a6a61cd80f678377f593166685ab674301e6625c00ffbf681535a255
  irrelevant_control:
    id: accessible-empty-state-copy
    version: v1
    sha256: f96e10031f42a50aa1b2962fbf2c257da80e2053a9252223b1613dac1dcda240
contract:
  accepted_fields:
    - id
    - displayName
    - apiVersion
    - entrypoint
    - capabilities
  api_version: v1
  max_display_name_length: 64
  entrypoint: must-start-with-dot-slash-and-contain-no-parent-segment
  capabilities:
    - read
    - transform
    - write
  diagnostics:
    required_fields:
      - file
      - path
      - code
    ordered_by: path-then-code
    accumulate_independent_violations: true
checks:
  - valid-manifest-is-preserved
  - malformed-fields-are-rejected-with-stable-diagnostics
  - missing-fields-are-accumulated
  - property-order-does-not-change-diagnostics
  - validation-does-not-mutate-input
scoring:
  functional: required
  stable-diagnostics: required
  practice-adherence: behavior-probes-required
