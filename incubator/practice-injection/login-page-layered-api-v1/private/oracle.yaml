id: login-page-layered-api-v1
semantic_oracle:
  command: bun run test
  assertions:
    - 正确凭证在原页面显示欢迎状态。
    - 错误凭证显示通用认证错误。
    - 请求期间禁用控件且拒绝重复提交。
practice_probe:
  command: bun run private/evaluator/verify-layering.ts public/starter/app
  component: src/LoginPage.tsx
  boundary: 由提交路径实际调用的本地 feature API 或领域操作模块
  required_api_responsibilities:
    - 请求调用位于组件外的边界模块
    - 不将原始 response 或 response.body 作为领域结果返回给组件
    - 401 在边界模块中转换为领域错误或领域结果
  forbidden_component_responsibilities:
    - 直接导入 services/http
    - 直接调用 postLogin 或 fetch
    - 判断原始响应状态
baseline_expected_result:
  semantic: pass
  practice_probe: fail
