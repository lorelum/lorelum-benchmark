# Per-condition git history materialized by the diagnostic runner.
# The last commit captures every remaining file (add -A), including the
# condition-injected convention document (docs/frontend-guide.md) for the
# oracle-practice / irrelevant-practice conditions; the baseline workspace has
# no convention document and therefore a slightly different (smaller) history.
# The tree is reproduced by this manifest plus the condition injection payload.
identity:
  name: ops-admin
  email: ops@meridian.internal
commits:
  - message: "chore: scaffold Vite React account console"
    files:
      - index.html
      - package.json
      - bun.lock
      - tsconfig.json
      - tsconfig.app.json
      - tsconfig.node.json
      - vite.config.ts
      - playwright.config.ts
      - .gitignore
      - src/main.tsx
      - src/styles.css
  - message: "feat(api): add profile endpoint client and API docs"
    files:
      - src/services/http.ts
      - docs/profile-api.md
  - message: "test: cover the profile flow with Playwright"
    files:
      - tests/profile.spec.ts
  - message: "feat: account profile page shell awaiting wiring"
    files: []