id: llm-provider-gateway-v3
lifecycle_stage: candidate
kernel:
  core: v1
  profile: injection-calibration/v2
  materializer_kind: node-ts
source:
  kind: repository-local-starter
  repository: lorelum/lorelum-benchmark
  source_commit: 31e25085d4278194e9aba18992de0d14cb010198
  public_root: public/starter/app
  immutable_by: private/snapshot.json
calibration_roles:
  - id: calibration-matrix
    command: [bun, run, "{{candidate_path}}/private/calibration/run.ts"]
    expect: { kind: pass }
calibration_sets:
  manifest: private/calibration/sets.yaml
runtime:
  package_manager: bun
  node: 22.19.x
  backend: { typescript: 5.9.3 }
baseline_expectation:
  functional: false
  practice_adherence: false
  reason: v3 公开 starter 只保留 OpenAI 非流式直连路径与最小消息类型；未预置统一模型契约、供应商注册表、领域错误、集中政策或账本边界，公开测试未通过。
