id: async-cleanup-v1
lifecycle_stage: candidate
kernel:
  core: v1
  profile: skill-trigger-orchestration/v1
  materializer_kind: react-vite
calibration_roles:
  - id: cleanup-probe-matrix
    command: [bun, run, "{{candidate_path}}/private/calibration/run.ts"]
    expect: { kind: pass }
calibration_sets:
  manifest: private/calibration/sets.yaml
source:
  kind: repository-local-starter
  repository: lorelum/lorelum-benchmark
  base_commit: ee69b926b0a54acaa1ee33da09eebc57734376a8
  public_root: public/starter/app
  immutable_by: private/snapshot.json
runtime:
  package_manager: bun
  node: 22.19.x
  frontend:
    vite: 7.1.7
    react: 19.2.3
    typescript: 5.9.3
  browser_test:
    playwright: 1.61.1
public_behavior:
  loading_message: 加载中…
  project_count: 3
  active_label: 进行中
  archived_label: 已归档
  unavailable_message: 项目列表暂时不可用
  request_delay_ms: 300
public_boundary:
  excludes:
    - Practice 卡文本与标识
    - 异步生命周期清理验收断言
    - 私有评测器与 Oracle
baseline_expectation:
  functional: true
  practice_adherence: false
  reason: Dashboard 的 useEffect 发起请求后直接 setState，未返回 cleanup。
