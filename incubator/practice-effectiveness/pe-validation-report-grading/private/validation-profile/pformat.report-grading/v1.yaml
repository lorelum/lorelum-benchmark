id: pformat.report-grading
version: 1
kind: source-derived-test-practice
lifecycle_stage: candidate
source_snapshot:
  repository: lorelum/lorelum
  pull_request: 10
  commit: bd0479b8bc02f5a1d1aa445cfa377875c4fe8bb4
  files:
    - packages/format/src/validate/report.ts
    - packages/format/src/validate/validate.ts
relevance:
  applicable_scenario: A local validation API returns outcomes for a caller to present and act on.
  rationale: The source groups validation outcomes by error, warning, and info levels, and only errors determine report validity.
  unsupported_semantics:
    - Stable diagnostic ordering or complete issue accumulation.
    - Format-stage short-circuit behavior, graph validation, or body-reference validation.
    - Dynamic retrieval or injection timing.
pinned_treatment_content:
  oracle_practice:
    id: pformat-report-grading-oracle-v1
    content: >-
      When returning local validation outcomes, preserve distinct blocking and
      non-blocking categories. Determine overall validity only from blocking
      outcomes, while retaining non-blocking feedback for the caller.
  irrelevant_control:
    id: pformat-report-grading-irrelevant-v1
    content: >-
      When drafting a local release note, keep the title concise, name the
      intended audience, and include a rollback contact. Do not change service
      configuration, validation behavior, or deployment commands.
condition_readiness:
  baseline: no injected profile content
  oracle-practice: content is pinned above; runnable only through a versioned Oracle Pi-skill treatment manifest
  lorelum-retrieval: deferred until a versioned retrieval adapter can select and inject pinned output
  irrelevant-practice: control content is pinned above; runnable only through a versioned control Pi-skill treatment manifest
functional_acceptance:
  - The report returns separate structured buckets for the three source-supported outcome levels.
profile_adherence_probes:
  - Warnings and infos remain visible without invalidating the report.
  - Errors invalidate the report.
non_applicable_conditions:
  - A caller that needs stable ordering, complete accumulation, or stage-level validation behavior.
  - Any filesystem, network, model, or dynamic-injection behavior.
conclusion_boundary: >-
  This profile can test the relevance of pinned treatment content for this
  snapshotted candidate kernel only. It is not evidence of an existing team Practice,
  product-wide Lorelum effectiveness, production validation quality, or dynamic
  injection behavior.
