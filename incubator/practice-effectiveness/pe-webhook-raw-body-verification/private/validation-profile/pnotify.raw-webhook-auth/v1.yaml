id: pnotify.raw-webhook-auth
version: 1
kind: source-derived-test-practice
lifecycle_stage: candidate
source_snapshot:
  repository: lorelum/notify-bus
  pull_request: 2
  commit: a18318885755049f7a80ccc29ccbc123d5958d69
  files:
    - packages/server/src/lib/verify/github.ts
    - packages/server/src/routes/webhook.ts
relevance:
  applicable_scenario: A local webhook entry point has a configured secret and must prevent untrusted input from invoking an in-memory event handler.
  rationale: The source verifies an HMAC-SHA256 signature over the raw body before parse, render, route match, and dispatch.
  unsupported_semantics:
    - HTTP server behavior, production secrets, key management, external adapter delivery, or development mode without a configured secret.
    - Dynamic retrieval or injection timing.
pinned_treatment_content:
  oracle_practice:
    id: pnotify-raw-webhook-auth-oracle-v1
    content: >-
      For a webhook with a configured secret, authenticate the original request
      content before parsing or handling it. Reject missing or invalid
      authentication without invoking downstream event handling.
  irrelevant_control:
    id: pnotify-raw-webhook-auth-irrelevant-v1
    content: >-
      When drafting a local release note, keep the title concise, name the
      intended audience, and include a rollback contact. Do not change webhook
      handling, authentication, or deployment commands.
condition_readiness:
  baseline: no injected profile content
  oracle-practice: content is pinned above; runnable only through a versioned Oracle Pi-skill treatment manifest
  lorelum-retrieval: deferred until a versioned retrieval adapter can select and inject pinned output
  irrelevant-practice: control content is pinned above; runnable only through a versioned control Pi-skill treatment manifest
functional_acceptance:
  - A fixed authorized local request reaches the in-memory handler and a fixed unauthorized request is rejected.
profile_adherence_probes:
  - Invalid raw input does not parse before authentication is rejected.
  - Missing or invalid authentication never invokes the downstream handler.
non_applicable_conditions:
  - A webhook without a configured secret, or a workflow requiring HTTP, production credentials, key management, or external delivery.
  - Any filesystem, network, model, or dynamic-injection behavior.
conclusion_boundary: >-
  This profile can test the relevance of pinned treatment content for this
  snapshotted candidate kernel only. It is not evidence of an existing team Practice,
  product-wide Lorelum effectiveness, production webhook security, or dynamic
  injection behavior.
