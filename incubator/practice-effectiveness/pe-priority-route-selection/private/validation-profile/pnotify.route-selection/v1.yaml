relevance:
  applicable_scenario: A local notification service selects one usable route for a matching event from fixed configuration.
  rationale: The source sorts matching routes by ascending priority and dispatches the first, while explicit action exclusion overrides action matching and unavailable routes are not viable.
  unsupported_semantics:
    - Database sorting, pagination, retries, external adapter delivery, or live-channel behavior.
    - Dynamic retrieval or injection timing.
pinned_treatment_content:
  oracle_practice:
    id: pnotify-route-selection-oracle-v1
    content: >-
      For a local notification event, select one usable configured route
      deterministically. Respect explicit exclusions over positive matches, and
      do not let an unavailable route prevent selection of a viable target.
  irrelevant_control:
    id: pnotify-route-selection-irrelevant-v1
    content: >-
      When drafting a local release note, keep the title concise, name the
      intended audience, and include a rollback contact. Do not change route
      selection, event filtering, or deployment commands.
condition_readiness:
  baseline: no injected profile content
  oracle-practice: content is pinned above; runnable only through a versioned Oracle Pi-skill treatment manifest
  lorelum-retrieval: deferred until a versioned retrieval adapter can select and inject pinned output
  irrelevant-practice: control content is pinned above; runnable only through a versioned control Pi-skill treatment manifest
functional_acceptance:
  - Matching events select a usable local route and unmatched events return no route.
profile_adherence_probes:
  - Route input order does not change the priority-selected result.
  - Explicit exclusion overrides an otherwise positive action match.
  - An unavailable route does not stop selection of a viable target.
non_applicable_conditions:
  - A workflow requiring database ordering, paging, retries, live delivery, or external channel state.
  - Any filesystem, network, model, or dynamic-injection behavior.
conclusion_boundary: >-
  This profile can test the relevance of pinned treatment content for this
  snapshotted candidate kernel only. It is not evidence of an existing team Practice,
  product-wide Lorelum effectiveness, production notification delivery, or dynamic
  injection behavior.
