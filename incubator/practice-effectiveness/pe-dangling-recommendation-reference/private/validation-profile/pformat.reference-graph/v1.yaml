id: pformat.reference-graph
version: 1
kind: source-derived-test-practice
lifecycle_stage: candidate
source_snapshot:
  repository: lorelum/lorelum
  pull_request: 10
  commit: bd0479b8bc02f5a1d1aa445cfa377875c4fe8bb4
  files:
    - packages/format/src/validate/validate.ts
relevance:
  applicable_scenario: A local publication check validates decision configuration that points to separately declared entries.
  rationale: The source treats Decision Node recommend targets that do not resolve to a Practice id as validation errors.
  unsupported_semantics:
    - Practice body references, decision cycles, duplicate identities, format-stage short-circuit, or dependency resolution.
    - Dynamic retrieval or injection timing.
pinned_treatment_content:
  oracle_practice:
    id: pformat-reference-graph-oracle-v1
    content: >-
      Before publishing local decision configuration, verify that every target
      it directs users to exists in the declared local entries. Treat an
      unresolved target as blocking rather than leaving a broken path.
  irrelevant_control:
    id: pformat-reference-graph-irrelevant-v1
    content: >-
      When drafting a local release note, keep the title concise, name the
      intended audience, and include a rollback contact. Do not change
      validation behavior, decision configuration, or deployment commands.
condition_readiness:
  baseline: no injected profile content
  oracle-practice: content is pinned above; runnable only through a versioned Oracle Pi-skill treatment manifest
  lorelum-retrieval: deferred until a versioned retrieval adapter can select and inject pinned output
  irrelevant-practice: control content is pinned above; runnable only through a versioned control Pi-skill treatment manifest
functional_acceptance:
  - Local entry and decision shapes remain checked, and a complete local configuration remains publishable.
profile_adherence_probes:
  - All relevant decision targets resolve across the local entry and decision files.
  - A dangling decision target blocks publication even when another target resolves.
non_applicable_conditions:
  - A workflow requiring body-reference validation, cycle detection, duplicate-id checks, or dependency resolution.
  - Any filesystem, network, model, or dynamic-injection behavior.
conclusion_boundary: >-
  This profile can test the relevance of pinned treatment content for this
  snapshotted candidate kernel only. It is not evidence of an existing team Practice,
  product-wide Lorelum effectiveness, production publication safety, or dynamic
  injection behavior.
