id: pe-structured-validation-errors-v1
source: contract-derived-seed
status: candidate-only
reference_solution: reference/src/config.ts
contract:
  fields: [name, revision, output, modes]
  revision: v1
  outputs: [summary, full]
  modes: [safe, fast]
  diagnostics:
    required_fields: [path, code]
    ordered_by: path-then-code
    accumulate_independent_violations: true
checks:
  - valid-config-is-preserved
  - independent-errors-are-accumulated
  - missing-fields-are-accumulated
  - ordering-and-input-immutability-are-stable
scoring:
  functional: required
  structured-diagnostics: required
  practice-adherence: pending-versioned-practice
