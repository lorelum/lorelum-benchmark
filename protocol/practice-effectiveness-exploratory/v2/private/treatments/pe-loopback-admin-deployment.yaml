version: v2
treatments:
  oracle:
    id: pnotify-loopback-deployment-oracle-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. For an
      unauthenticated administrative service in Compose, bind host exposure to
      loopback by default, retain the service's internal port and configurable
      host port, and describe separately managed TLS proxy access for external
      traffic.
  irrelevant:
    id: pnotify-loopback-deployment-irrelevant-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. For a
      release note accompanying a local service, state the audience, summarize
      the rollout, retain an owner for rollback, and describe separately
      managed archival storage for long-term records.
