version: v2
treatments:
  oracle:
    id: pformat-reference-graph-oracle-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. Build the
      declared-entry identity set before validating decisions; every decision
      target must resolve in that set, and every unresolved target is a
      blocking publication error rather than a broken path left in place.
  irrelevant:
    id: pformat-reference-graph-irrelevant-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. Build the
      release-note audience list before drafting sections; every section must
      name an audience, and every unnamed audience is a blocking editorial
      error rather than a placeholder left in place.
