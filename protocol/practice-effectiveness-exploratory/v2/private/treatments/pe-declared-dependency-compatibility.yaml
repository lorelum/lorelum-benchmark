version: v2
treatments:
  oracle:
    id: pformat-v1-compat-boundary-oracle-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. In v1, keep
      a declared but unsupported dependency field intact, return explicit
      non-blocking compatibility feedback, and do not resolve, reject, or
      silently discard the declaration.
  irrelevant:
    id: pformat-v1-compat-boundary-irrelevant-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. In a release
      note, keep a declared but deferred follow-up intact, return explicit
      non-blocking ownership context, and do not resolve, reject, or silently
      discard the planned follow-up.
