version: v2
treatments:
  oracle:
    id: pformat-report-grading-oracle-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. When a
      validator returns findings, place every finding in its error, warning, or
      info bucket, preserve non-blocking feedback, and derive overall validity
      solely from whether the error bucket is empty.
  irrelevant:
    id: pformat-report-grading-irrelevant-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. When a
      release note returns publication details, place every detail in audience,
      rollout, or follow-up sections, preserve non-blocking context, and derive
      publication readiness solely from whether an owner is assigned.
