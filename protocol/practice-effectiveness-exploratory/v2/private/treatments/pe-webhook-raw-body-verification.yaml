version: v2
treatments:
  oracle:
    id: pnotify-raw-webhook-auth-oracle-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. With a
      configured webhook secret, authenticate original request content before
      parsing or dispatch, reject missing or invalid authentication, and never
      invoke downstream handling for a rejected request.
  irrelevant:
    id: pnotify-raw-webhook-auth-irrelevant-v2
    content: >-
      Treat this rule as a binding implementation checklist. Before editing,
      identify each constraint; make the smallest compatible change; then
      inspect the finished starter files against every constraint. With a
      configured release owner, confirm original draft ownership before review,
      reject missing or invalid ownership, and never invoke downstream release
      publication for a rejected draft.
