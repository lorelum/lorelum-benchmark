name: Validate benchmark workspace

on:
  push:
  pull_request:

jobs:
  workspace:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run test:contracts
      - run: bun run test:fixtures

  formal-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file Dockerfile.formal-pi --tag lorelum-formal-pi:ci .
      - run: docker run --rm --entrypoint /bin/sh lorelum-formal-pi:ci -ec 'test "$(bun --version)" = "1.3.11"; test "$(node --version)" = "v22.19.0"; test "$(pi --version)" = "0.80.10"'

  realistic-repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bunx playwright@1.61.1 install --with-deps chromium
      - run: bun run test:realistic-repo
