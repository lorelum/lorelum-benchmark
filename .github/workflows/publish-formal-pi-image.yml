name: Publish formal Pi container image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.formal-pi
      - package.json
      - bun.lock
      - .github/workflows/publish-formal-pi-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.formal-pi
          push: true
          platforms: linux/amd64
          tags: ghcr.io/${{ github.repository }}/formal-pi:${{ github.sha }}
      - run: echo "Pin ghcr.io/${{ github.repository }}/formal-pi@${{ steps.build.outputs.digest }} in the formal environment before running smoke." >> "$GITHUB_STEP_SUMMARY"
